#//// Neoffice — added file (no upstream equivalent): makes the repository
#//// installable as a Frappe app so its built assets are served from
#//// /assets/opengym/. The React sources under frontend/ are untouched by this.
[project]
name = "opengym"
authors = [
    { name = "Duarte Santos", email = "hello@duarte-santos.ch" },
]
description = "openGym — self-hosted gym & body-weight tracker (Neoffice fork)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"
